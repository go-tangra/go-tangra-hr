# Freya service-to-service policy for the hr module
# (specs/028-hr-v4/contracts/mesh-policies.md). The gateway forwards browser
# traffic; only the scheduler executes hr's task types (carry-over, signing
# reconciliation, member sync). hr exposes no other gRPC API. Its own outbound
# calls (auth Profiles and Authorization, notification Notifier/Send, the
# signing module API, scheduler task-type registration, lcm enrolment) are
# allowed by the callees' policies.
version: hr-dev-1
rules:
  - id: gateway-forwards
    from: ["spiffe://example.org/svc/gateway"]
    to: ["hr"]
    operations: ["*"]
    effect: allow
  - id: scheduler-execute
    from: ["spiffe://example.org/svc/scheduler"]
    to: ["hr"]
    operations: ["/scheduler.v1.TaskExecutor/ExecuteTask"]
    effect: allow
